# Cloudflare Workers CI/CD, installed by vercel-to-cloudflare-workers/kit/setup.mjs
#
#   pull_request → `cf-check` (the same script as `npm run cf:check` on your machine):
#                  lockfile · types · lint · tests · your checks · env · OpenNext build ·
#                  bundle size · boots the Worker in workerd and loads your pages.
#                  Optional preview URL comment ("previews": true in cloudflare.config.json).
#   push to main → same check, then migrate → deploy → live smoke → auto-rollback.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   dash.cloudflare.com → My Profile → API Tokens → "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  dash.cloudflare.com → Workers & Pages → Account ID
#   PRODUCTION_ENV         your production .env file (gh secret set PRODUCTION_ENV < .env.production)
# Then make the "check" job required: Settings → Branches → main → Require status checks → check.
name: Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
  HAS_ENV: ${{ secrets.PRODUCTION_ENV != '' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Production env (build-time vars + secrets for the local Worker)
        if: env.HAS_ENV == 'true'
        run: |
          printf '%s\n' "$PRODUCTION_ENV" > .env.production
          cp .env.production .dev.vars
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
      - name: Warn when PRODUCTION_ENV is missing
        if: env.HAS_ENV != 'true'
        run: echo "::warning::PRODUCTION_ENV secret is not set. The build has no NEXT_PUBLIC_* values and the smoke test has no server secrets."
      - name: cf-check (identical to local `cf:check`)
        run: node scripts/cloudflare/cf-check.mjs --ci
      - name: Preview version
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.HAS_CF == 'true'
        run: node scripts/cloudflare/cf-check.mjs --ci --preview "pr-${{ github.event.number }}"
      - name: Comment the preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            const body = `${marker}\n**Cloudflare preview:** ${process.env.URL}\n\n_Uses production secrets and data, so treat it like production._`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = data.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: cloudflare-deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - name: Cloudflare credentials
        working-directory: .
        run: |
          if [ "$HAS_CF" != "true" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable deploys."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Production env
        if: env.HAS_ENV == 'true'
        run: printf '%s\n' "$PRODUCTION_ENV" > .env.production
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
      - name: Build → migrate → deploy → live smoke → rollback on failure
        run: node scripts/cloudflare/cf-check.mjs --ci --deploy
